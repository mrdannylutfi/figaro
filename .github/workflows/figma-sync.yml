name: Sync Figma Design System

on:
  # Allows manual triggering from the GitHub Actions UI
  workflow_dispatch: 
  # Optional: Triggers automatically on a cron schedule (e.g., every day at midnight)
  schedule:
    - cron: '0 0 * * *'

jobs:
  sync-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch and Parse Figma Tokens & Components
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
          FIGMA_TARGET_NODES: ${{ secrets.FIGMA_TARGET_NODES }} # Comma-separated node IDs
        run: node scripts/figma-compiler.js

      - name: Format Generated Code
        run: npx prettier --write "src/generated/**/*" "tailwind.config.js"

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(design): automated synchronization with Figma master file [skip ci]"
          file_pattern: 'src/generated/* tailwind.config.js theme.json'
          branch: main
